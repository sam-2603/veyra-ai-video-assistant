services:
  # ─────────────────────────────────────────────────────────────
  # BACKEND
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: veyra-backend
    runtime: docker

    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    envVars:
      - key: GROQ_API_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: ALLOWED_ORIGINS
        value: https://veyra-frontend.onrender.com


  # ─────────────────────────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: veyra-frontend
    runtime: static

    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist

    envVars:
      - key: VITE_API_URL
        value: https://veyra-backend.onrender.com